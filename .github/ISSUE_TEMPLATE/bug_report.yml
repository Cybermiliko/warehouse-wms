name: Bug report
description: Report a reproducible Warehouse WMS problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Remove confidential inventory information before submitting.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iPhone
        - iPad
        - macOS
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
